<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Budget Tracker 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

:root{--bg:#f4f7f2;--card:#fff;--border:#d8e8dc;--g1:#2d5a3d;--g2:#4a8c62;--g3:#7ab893;--gp:#c8e6d0;--gw:#edf5ef;--am:#c9822a;--amp:#fdf0e0;--rd:#c0392b;--rdp:#fdecea;--bl:#3a6ea8;--blp:#e8f0fb;--pu:#7c5cbf;--pup:#f0ecfc;--tx:#1c3428;--txm:#6b8f75;--txl:#9dbfa8;--sh:0 2px 12px rgba(45,90,61,.08);--shm:0 4px 24px rgba(45,90,61,.14);--r:14px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;}
.hdr{background:linear-gradient(135deg,var(--g1) 0%,#3d7a55 100%);padding:22px 32px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.18);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-bottom:14px;}
.logo{display:flex;align-items:center;gap:11px;}
.logo-icon{font-size:26px;}
.logo h1{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.3px;}
.logo p{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}
.vtoggle{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;gap:2px;}
.vbtn{padding:7px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;background:transparent;color:rgba(255,255,255,.7);}
.vbtn.active{background:#fff;color:var(--g1);}
.mtabs{padding:0 32px;display:flex;gap:0;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1);}
.mtabs::-webkit-scrollbar{height:3px;}.mtabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px;}
.mtab{padding:11px 18px;border:none;background:transparent;color:rgba(255,255,255,.55);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;}
.mtab:hover{color:rgba(255,255,255,.9);}
.mtab.active{color:#fff;border-bottom-color:var(--g3);font-weight:700;}
.mtab.hasdata::after{content:'·';font-size:18px;margin-left:4px;vertical-align:middle;color:var(--g3);}
.main{padding:24px 32px;max-width:1440px;margin:0 auto;}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px;}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border);}
.sc .clabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txm);margin-bottom:8px;}
.sc .cval{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1;}
.sc .cval.pos{color:var(--g2);}.sc .cval.neg{color:var(--rd);}
.sc .csub{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--txm);display:flex;align-items:center;gap:6px;}
.cicon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;float:right;margin:-2px -2px 0 0;}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.bg{background:var(--gp);color:var(--g1);}.br{background:var(--rdp);color:var(--rd);}.ba{background:var(--amp);color:var(--am);}.bb{background:var(--blp);color:var(--bl);}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
.ccrd{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border);}
.ccrd.fw{grid-column:1/-1;}
.ctitle{font-size:14px;font-weight:700;margin-bottom:3px;}
.csub2{font-size:12px;color:var(--txm);margin-bottom:16px;}
.cwrap{position:relative;}
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
.spanel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;}
.sp-hdr{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;}
.sp-hdr-title{font-size:12px;font-weight:800;letter-spacing:.8px;color:#fff;text-transform:uppercase;}
.sp-edit-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;}
.sp-edit-btn:hover{background:rgba(255,255,255,.35);}
.sp-save-btn{background:#fff;border:none;color:var(--g1);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;}
.sp-cancel-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;}
.sptable{width:100%;border-collapse:collapse;font-size:12px;}
.sptable th{text-align:left;padding:7px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);background:var(--gw);border-bottom:1px solid var(--border);}
.sptable th.ra{text-align:right;}
.sptable td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.sptable tr:last-child td{border-bottom:none;}
.sptable tr:hover td{background:#f9fbf9;}
.sc-name{font-weight:600;color:var(--tx);font-size:12px;}
.sc-bud{text-align:right;color:var(--txm);}
.sc-act{text-align:right;font-weight:700;}
.sc-stat{text-align:right;font-size:11px;font-weight:700;white-space:nowrap;}
.sp-foot{padding:9px 12px;background:var(--gw);border-top:2px solid var(--border);display:flex;justify-content:space-between;font-size:12px;font-weight:800;}
.sp-add{width:100%;padding:8px;border:none;background:none;color:var(--g2);font-size:12px;font-weight:600;cursor:pointer;border-top:1px dashed var(--border);text-align:left;}
.sp-add:hover{background:var(--gw);}
.sc-input{width:100%;border:1px solid var(--border);border-radius:5px;padding:4px 7px;font-size:12px;background:var(--bg);color:var(--tx);outline:none;}
.sc-input:focus{border-color:var(--g2);}
.sc-input.name-inp{min-width:90px;}
.sc-input.amt-inp{width:90px;text-align:right;}
.del-sc{background:none;border:none;cursor:pointer;color:var(--txl);font-size:13px;padding:2px 4px;border-radius:4px;line-height:1;}
.del-sc:hover{color:var(--rd);}
.txsec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;}
.txhdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.txctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.sbox{padding:8px 13px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--tx);background:var(--bg);outline:none;width:190px;transition:border-color .2s;}
.sbox:focus{border-color:var(--g2);}
.fsel{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--tx);background:var(--bg);outline:none;cursor:pointer;}
.abtn{padding:8px 16px;background:var(--g1);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .2s;}
.abtn:hover{background:var(--g2);}
table.txt{width:100%;border-collapse:collapse;}
table.txt th{text-align:left;padding:10px 15px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);background:var(--gw);border-bottom:1px solid var(--border);}
table.txt td{padding:11px 15px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.txt tr:last-child td{border-bottom:none;}
table.txt tr:hover td{background:#f9fbf9;}
.td-desc{font-size:13px;font-weight:600;}.td-note{font-size:11px;color:var(--txm);margin-top:2px;}
.td-date{font-size:12px;color:var(--txm);white-space:nowrap;}
.td-amt{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;}
.td-amt.inc{color:var(--g2);}
.cchip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.nodata{padding:44px;text-align:center;color:var(--txm);}
.txpag{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pinfo{font-size:12px;color:var(--txm);}
.pbtns{display:flex;gap:5px;}
.pbtn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:var(--card);color:var(--tx);transition:all .2s;}
.pbtn:hover:not(:disabled){background:var(--gw);border-color:var(--g3);}
.pbtn:disabled{opacity:.35;cursor:default;}
.pbtn.act{background:var(--g1);color:#fff;border-color:var(--g1);}
.delbtn{background:none;border:none;cursor:pointer;color:var(--txl);font-size:15px;padding:3px;border-radius:4px;transition:color .2s;}
.delbtn:hover{color:var(--rd);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--card);border-radius:var(--r);padding:26px;width:100%;max-width:480px;box-shadow:var(--shm);}
.modal h3{font-size:17px;font-weight:800;margin-bottom:18px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--txm);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .2s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--g2);}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.bcnl{padding:9px 18px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600;}
.bsav{padding:9px 22px;background:var(--g1);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
.bsav:hover{background:var(--g2);}
.plan-month-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.plan-title{font-size:18px;font-weight:800;}
.plan-hint{font-size:12px;color:var(--txm);margin-bottom:20px;}
.plan-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.plan-cat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);overflow:hidden;}
.plan-cat-hdr{padding:11px 16px;display:flex;align-items:center;gap:8px;}
.plan-cat-hdr span{font-size:12px;font-weight:800;letter-spacing:.7px;color:#fff;text-transform:uppercase;}
.plan-table{width:100%;border-collapse:collapse;font-size:12px;}
.plan-table th{padding:7px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);background:var(--gw);border-bottom:1px solid var(--border);}
.plan-table th:last-child{text-align:right;}
.plan-table td{padding:7px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.plan-table tr:last-child td{border-bottom:none;}
.plan-name-inp{width:100%;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--tx);outline:none;}
.plan-name-inp:focus{border-color:var(--g2);}
.plan-amt-inp{width:110px;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--tx);outline:none;text-align:right;}
.plan-amt-inp:focus{border-color:var(--g2);}
.plan-del{background:none;border:none;cursor:pointer;color:var(--txl);font-size:13px;padding:2px 5px;}
.plan-del:hover{color:var(--rd);}
.plan-add{width:100%;padding:8px;border:none;background:none;color:var(--g2);font-size:12px;font-weight:600;cursor:pointer;border-top:1px dashed var(--border);text-align:left;}
.plan-add:hover{background:var(--gw);}
.plan-foot{padding:10px 12px;background:var(--gw);border-top:2px solid var(--border);display:flex;justify-content:space-between;font-size:12px;font-weight:800;}
.plan-save-row{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;}
.plan-copy-btn{padding:9px 18px;background:#3a6ea8;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.plan-copy-btn:hover{background:#2f5d90;}
.plan-summary{display:flex;align-items:center;gap:12px;margin-top:20px;padding:16px 20px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);flex-wrap:wrap;}
.plan-sum-item{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:10px;border:1px solid var(--border);}
.plan-sum-bal{flex:1.3;}
.plan-sum-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);}
.plan-sum-val{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.plan-sum-op{font-size:22px;font-weight:800;color:var(--txl);padding:0 4px;}
.plan-save-btn{padding:10px 28px;background:var(--g1);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.plan-save-btn:hover{background:var(--g2);}
.plan-reset-btn{padding:10px 18px;border:1px solid var(--border);background:var(--card);color:var(--tx);border-radius:8px;font-size:13px;cursor:pointer;}
.saved-toast{position:fixed;bottom:24px;right:24px;background:var(--g1);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shm);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;}
.saved-toast.show{transform:translateY(0);opacity:1;}
.ytd-ttl{font-size:12px;font-weight:700;color:var(--txm);margin-bottom:20px;letter-spacing:.5px;}
.snap-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.snap-tbl th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);background:var(--gw);border-bottom:1px solid var(--border);}
.snap-tbl th.ra{text-align:right;}
.snap-tbl td{padding:10px 14px;border-bottom:1px solid var(--border);}
.snap-tbl tr:hover td{background:var(--gw);}
.snap-tbl td.ra{text-align:right;}
.stitle{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
@media(max-width:1100px){.spgrid,.plan-cats{grid-template-columns:1fr 1fr;}.sgrid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:800px){.main{padding:14px;}.sgrid,.crow{grid-template-columns:1fr 1fr;}.spgrid,.plan-cats{grid-template-columns:1fr;}.hdr{padding:16px 14px 0;}.mtabs{padding:0 14px;}}
@media(max-width:520px){.sgrid{grid-template-columns:1fr 1fr;}.frow{grid-template-columns:1fr;}}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:var(--gp);border-radius:3px;}
/* ===== 2027 additions ===== */
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.gear{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;}
.gear:hover{background:rgba(255,255,255,.28);}
.mtabs.hide{display:none;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.sec-title{font-size:18px;font-weight:800;}
.sec-hint{font-size:12px;color:var(--txm);margin-top:3px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.obtn{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--tx);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.obtn:hover{background:var(--gw);border-color:var(--g3);}
.seg{display:flex;background:var(--gw);border:1px solid var(--border);border-radius:8px;padding:2px;}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--txm);cursor:pointer;}
.seg button.on{background:var(--g1);color:#fff;}
/* debt cards */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
.dcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:18px;position:relative;}
.dcard.focus{border:2px solid var(--rd);}
.dcard.done{opacity:.75;border:2px solid var(--g3);}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.dc-name{font-size:15px;font-weight:800;}
.dc-meta{font-size:11px;color:var(--txm);margin-top:3px;}
.dc-bal{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:14px 0 4px;color:var(--rd);}
.dc-bal.zero{color:var(--g2);}
.dc-sub{font-size:11.5px;color:var(--txm);}
.pbar{height:9px;background:var(--gw);border-radius:6px;overflow:hidden;margin:12px 0 6px;border:1px solid var(--border);}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--g2),var(--g3));border-radius:6px;transition:width .4s;}
.dc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.dc-stat .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txm);}
.dc-stat .v{font-size:13px;font-weight:700;margin-top:2px;}
.dc-btns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.dc-btns button{flex:1;min-width:60px;padding:7px 8px;border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--tx);}
.dc-btns button.pri{background:var(--g1);color:#fff;border-color:var(--g1);}
.dc-btns button:hover{filter:brightness(.96);}
.focus-tag{position:absolute;top:-10px;right:14px;background:var(--rd);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.4px;}
.done-tag{position:absolute;top:-10px;right:14px;background:var(--g2);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;}
.empty-card{background:var(--card);border:2px dashed var(--border);border-radius:var(--r);padding:36px;text-align:center;color:var(--txm);margin-bottom:22px;}
/* year grid */
.ygwrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);background:var(--card);box-shadow:var(--sh);margin-bottom:22px;}
table.yg{border-collapse:collapse;width:100%;min-width:1100px;font-size:12px;}
table.yg th{padding:9px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--txm);background:var(--gw);border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;}
table.yg th.cur{background:var(--g1);color:#fff;}
table.yg td{padding:5px 4px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;}
table.yg .nm{position:sticky;left:0;background:var(--card);text-align:left;padding:8px 12px;min-width:190px;z-index:2;border-right:1px solid var(--border);}
table.yg th.nm{background:var(--gw);z-index:3;}
.nm-t{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.nm-m{font-size:10.5px;color:var(--txm);margin-top:2px;}
.nm-ed{background:none;border:none;cursor:pointer;color:var(--txl);font-size:12px;padding:0 2px;}
.nm-ed:hover{color:var(--g1);}
tr.yg-sec td{background:var(--bg);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--txm);text-align:left;padding:8px 12px;}
tr.yg-sec td.nm{background:var(--bg);}
.yc{display:block;border-radius:7px;padding:6px 2px;font-size:11px;font-weight:700;line-height:1.15;border:1px solid transparent;}
.yc small{display:block;font-size:9.5px;font-weight:600;opacity:.85;}
button.yc{width:100%;cursor:pointer;font-family:inherit;}
button.yc:hover{filter:brightness(.95);border-color:rgba(0,0,0,.15);}
.st-paid{background:#e3f4e8;color:#1f6b3f;}
.st-partial{background:#fff6dd;color:#9a6a10;border-color:#f0d68a;}
.st-over{background:#fdecea;color:#b0291c;border-color:#f3b5ae;}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let view='monthly';
let activeKey=defaultMonthKey();
let txPage=1, txFilter='All', txSubFilter='All', txSearch='';
const TX_PP=15;

function defaultMonthKey(){const d=new Date();return keyForDate(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)||(d>new Date(MONTHS[LAST].year,11,31)?MKEYS[LAST]:MKEYS[0]);}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtS=n=>(n<0?'-':'')+fmt(n);
const fmt0=n=>'₱'+Math.round(n||0).toLocaleString('en-PH');

const fdate=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});}catch{return d;}};

// ═══════════════════════════════════════════════
// LOCAL SAVE
// ═══════════════════════════════════════════════
function saveLocal(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({extraTx,customSubcat,trk,lastAccount}));}catch(e){}
}
function loadLocal(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');

    extraTx=s.extraTx||{}; customSubcat=s.customSubcat||{}; lastAccount=s.lastAccount||'';

// ═══════════════════════════════════════════════
// NOTION SYNC
// ═══════════════════════════════════════════════
const notionOn=()=>!!(NOTION.proxyUrl&&NOTION.dbId);
// One request at a time, with a short gap, and retry when Notion says "slow down" (429) —
// Notion allows about 3 requests per second.
let _nq=Promise.resolve();
function _notionFetch(path,method='GET',body=null){
  const run=async()=>{
    const opts={method,headers:{'Content-Type':'application/json'}};
    if(body)opts.body=JSON.stringify(body);
    for(let attempt=0;;attempt++){
      let r;
      try{r=await fetch(`${NOTION.proxyUrl}/notion/${path}`,opts);}
      catch(e){if(attempt<3){await sleep(1000*(attempt+1));continue;}throw e;}
      if(r.ok){await sleep(340);return r.json();}
      if((r.status===429||r.status>=500)&&attempt<5){
        const ra=parseFloat(r.headers.get('Retry-After'))||(1+attempt);await sleep(ra*1000);continue;}
      throw new Error('Notion API error: '+r.status);
    }
  };
  const p=_nq.then(run,run);_nq=p.catch(()=>{});return p;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Plan months edited on this device that Notion hasn't confirmed yet.
const DIRTY_KEY='mybudget2027_dirtyplans';
let dirtyPlans=new Set();
try{dirtyPlans=new Set(JSON.parse(localStorage.getItem(DIRTY_KEY)||'[]'));}catch(e){}
// One-time: plans edited before this fix may be half-saved in Notion, so treat this device's copy as the latest.
try{if(!localStorage.getItem('mybudget2027_planfix1')){
  const raw=JSON.parse(localStorage.getItem('mybudget2027_v1')||'null');
  if(raw&&raw.customSubcat)Object.keys(raw.customSubcat).forEach(k=>dirtyPlans.add(k));
  localStorage.setItem('mybudget2027_planfix1','1');}}catch(e){}
function saveDirty(){try{localStorage.setItem(DIRTY_KEY,JSON.stringify([...dirtyPlans]));}catch(e){}}
let trkDirty=false;try{trkDirty=localStorage.getItem('mybudget2027_trkdirty')==='1';}catch(e){}
function setTrkDirty(v){trkDirty=v;try{localStorage.setItem('mybudget2027_trkdirty',v?'1':'0');}catch(e){}}
async function notionQueryAll(dbId){
  let results=[],cursor=null;
  do{
    const body={page_size:100}; if(cursor)body.start_cursor=cursor;
    const data=await _notionFetch(`databases/${dbId}/query`,'POST',body);
    results=results.concat(data.results); cursor=data.has_more?data.next_cursor:null;
  }while(cursor);
  return results;
}
const rt=s=>[{text:{content:String(s||'').slice(0,1990)}}];
const ptxt=p=>(p&&p.rich_text||[]).map(t=>t.plain_text).join('');
async function notionCreate(tx,monthKey){
  const page=await _notionFetch('pages','POST',{parent:{database_id:NOTION.dbId},properties:{
    'Name':{title:rt(tx.desc)},'Date':{date:{start:tx.date}},'Amount':{number:tx.amount},
    'Category':{select:{name:tx.category}},'SubCategory':{rich_text:rt(tx.subcategory)},
    'Note':{rich_text:rt(tx.note)},'Month':{select:{name:monthKey}},
    'Type':{select:{name:tx.category==='Income'?'income':'expense'}},
    'Account':{rich_text:rt(tx.account)},'ToAccount':{rich_text:rt(tx.toAccount)}
  }});
  return page.id;
}
async function notionArchive(id){await _notionFetch(`pages/${id}`,'PATCH',{archived:true});}
async function notionSaveBudgetPlan(key){
  dirtyPlans.add(key);saveDirty();
  setSyncStatus('syncing');
  try{
    const existing=(await notionQueryAll(NOTION.planDbId)).filter(p=>p.properties.Month?.select?.name===key);
    // add the new rows first, then remove the old ones — a failure never leaves the month empty
    for(const cat of CATS){
      if(DERIVED.includes(cat))continue;
      for(const s of getSubcats(key,cat)){ if(!s.n)continue;
        await _notionFetch('pages','POST',{parent:{database_id:NOTION.planDbId},properties:{'Name':{title:rt(s.n)},'Month':{select:{name:key}},'Category':{select:{name:cat}},'Budget':{number:s.b||0}}});
      }
    }
    for(const p of existing)await notionArchive(p.id);
    dirtyPlans.delete(key);saveDirty();setSyncStatus('ok');
  }catch(e){setSyncStatus('error');throw e;}
}
let trkTimer=null;
function saveTrackers(){
  saveLocal();setTrkDirty(true);
  if(!notionOn()||!NOTION.trkDbId)return;
  clearTimeout(trkTimer);
  trkTimer=setTimeout(async()=>{
    try{
      const json=JSON.stringify(trk);
      const chunks=[];for(let i=0;i<json.length;i+=1900)chunks.push({text:{content:json.slice(i,i+1900)}});
      const props={'Name':{title:rt('trackers')},'Data':{rich_text:chunks.slice(0,100)}};
      if(trkPageId) await _notionFetch(`pages/${trkPageId}`,'PATCH',{properties:props});
      else { const p=await _notionFetch('pages','POST',{parent:{database_id:NOTION.trkDbId},properties:props}); trkPageId=p.id; }
      setTrkDirty(false);setSyncStatus('ok');
    }catch(e){setSyncStatus('error');}
  },1200);
}
async function loadFromNotion(){
  setSyncStatus('syncing');
  try{
    const pages=await notionQueryAll(NOTION.dbId);
    const fresh={};
    for(const page of pages){
      const p=page.properties; const month=p.Month?.select?.name;
      if(!month||!MKEYS.includes(month))continue;
      (fresh[month]=fresh[month]||[]).push({_nid:page.id,id:page.id,
        date:p.Date?.date?.start||'',desc:(p.Name?.title||[]).map(t=>t.plain_text).join(''),
        amount:p.Amount?.number||0,category:p.Category?.select?.name||'Expenses',
        subcategory:ptxt(p.SubCategory),note:ptxt(p.Note),account:ptxt(p.Account),toAccount:ptxt(p.ToAccount)});
    }
    // keep local items that never reached Notion
    for(const k of Object.keys(extraTx))for(const t of extraTx[k]||[]) if(!t._nid)(fresh[k]=fresh[k]||[]).push(t);
    extraTx=fresh;
    try{
      const planPages=await notionQueryAll(NOTION.planDbId);
      const map={};
      for(const page of planPages){
        const p=page.properties,m=p.Month?.select?.name,c=p.Category?.select?.name,n=(p.Name?.title||[]).map(t=>t.plain_text).join('');
        if(!m||!c||!n)continue; ((map[m]=map[m]||{})[c]=map[m][c]||[]).push({n,b:p.Budget?.number||0});
      }
      for(const [m,cats] of Object.entries(map))if(!dirtyPlans.has(m))customSubcat[m]=cats;
    }catch(e){console.warn('Plan sync skipped',e);}
    try{
      const tp=await notionQueryAll(NOTION.trkDbId);
      const pg=tp.find(x=>(x.properties.Name?.title||[]).map(t=>t.plain_text).join('')==='trackers');
      if(pg)trkPageId=pg.id;
      if(pg&&!trkDirty){const data=JSON.parse(ptxt(pg.properties.Data)||'null');
        if(data)trk=Object.assign(JSON.parse(JSON.stringify(DEFAULT_TRK)),data);}
      else saveTrackers(); // first connection, or this device has unsaved changes: upload them // first connection: upload this device's bills, debts, accounts
    }catch(e){console.warn('Tracker sync skipped',e);}
    saveLocal(); setSyncStatus('ok'); render();
    pushLocalOnly();
  }catch(e){console.error('Notion sync failed:',e);setSyncStatus('error');}
}
let pushing=false;
async function pushLocalOnly(){
  if(pushing)return;pushing=true;
  try{
    for(const k of MKEYS)for(const t of extraTx[k]||[])if(!t._nid){t._nid=await notionCreate(t,k);t.id=t._nid;}
    const planMonths=await notionQueryAll(NOTION.planDbId).then(r=>new Set(r.map(p=>p.properties.Month?.select?.name)));
    for(const k of Object.keys(customSubcat))if(!planMonths.has(k)||dirtyPlans.has(k))await notionSaveBudgetPlan(k);
    saveLocal();
  }catch(e){console.warn('Upload of local items failed',e);}
  pushing=false;
}
function setSyncStatus(state){
  const el=document.getElementById('sync-status');if(!el)return;
  const map={syncing:['🔄','Syncing…','var(--txm)'],ok:['☁️','Synced to Notion','var(--sage)'],error:['💾','Saved on this device','var(--am)']};
  const [i,t,c]=map[state]||map.error;
  el.innerHTML=`<span style="color:${c};font-size:11px;font-weight:700">${i} ${t}</span>`;
}

// DATA HELPERS
// ═══════════════════════════════════════════════
function monthIdx(key){return MKEYS.indexOf(key);}
function billsDue(mi){return trk.bills.filter(b=>(b.months||[]).includes(MONTHS[mi].num));}
function getSubcats(key,cat){
  const mi=monthIdx(key);
  if(cat==='Bills & Subscriptions')return billsDue(mi).map(b=>({n:b.name,b:b.amount}));
  if(cat==='Debts')return trk.debts.filter(d=>debtBalance(d,mi-1)>0||d.startBal===0).map(d=>({n:d.name,b:d.pay||0}));
  if(customSubcat[key]&&customSubcat[key][cat])return customSubcat[key][cat];
  return JSON.parse(JSON.stringify(PLAN_TEMPLATE[cat]||[]));
}
function getAllTx(key){return [...(extraTx[key]||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));}
function allTx(){return MKEYS.flatMap(k=>extraTx[k]||[]);}
function computeActuals(key){
  const res={};for(const c of [...CATS,'Transfer'])res[c]={total:0,subs:{}};
  for(const t of extraTx[key]||[]){
    if(!res[t.category])continue;
    res[t.category].total+=t.amount;
    const s=t.subcategory||'Other';res[t.category].subs[s]=(res[t.category].subs[s]||0)+t.amount;
  }
  return res;
}
function computeBudgets(key){const r={};for(const c of CATS)r[c]=getSubcats(key,c).reduce((s,x)=>s+(x.b||0),0);return r;}
const outflow=a=>OUT_CATS.reduce((s,c)=>s+a[c].total,0);
function openingCash(){return trk.accounts.reduce((s,a)=>s+(+a.opening||0),0);}
function computeStartingBalance(key){
  let bal=openingCash();
  for(const k of MKEYS){ if(k===key)break; const a=computeActuals(k); bal+=a['Income'].total-outflow(a); }
  return bal;
}
// account balance through end of month index mi (LAST = whole period)
function accountBalance(acct,mi=LAST){
  let bal=+acct.opening||0;
  for(let i=0;i<=mi;i++)for(const t of extraTx[MKEYS[i]]||[]){
    if(t.account===acct.name) bal+= t.category==='Income'?t.amount:-t.amount;
    if(t.toAccount===acct.name && t.category!=='Income') bal+=t.amount;
  }
  return bal;
}
function paidFor(name,cat,mi){
  return (extraTx[MKEYS[mi]]||[]).filter(t=>t.category===cat&&t.subcategory===name).reduce((s,t)=>s+t.amount,0);
}
function debtPaidThrough(d,mi){let s=0;for(let i=0;i<=mi;i++)s+=paidFor(d.name,'Debts',i);return s;}
function debtBalance(d,mi=LAST){return Math.max(0,(+d.startBal||0)+(+d.charges||0)-debtPaidThrough(d,mi));}
function curMonthIdx(){const d=new Date(),k=keyForDate(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);if(k)return MKEYS.indexOf(k);return d<new Date(MONTHS[0].year,MONTHS[0].num-1,1)?-1:LAST+1;}
function payoff(d){
  const B=debtBalance(d); if(B<=0)return {done:true};
  const P=+d.pay||0, r=(+d.rate||0)/100;
  if(P<=0)return {n:null};
  let n; if(r>0){ if(P<=B*r)return {never:true}; n=Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r)); } else n=Math.ceil(B/P);
  const base=curMonthIdx()<0?new Date(MONTHS[0].year,MONTHS[0].num-1,1):new Date(new Date().getFullYear(),new Date().getMonth(),1);
  return {n,date:new Date(base.getFullYear(),base.getMonth()+n,1)};
}
function lastDataIdx(){const c=curMonthIdx();let last=-1;MKEYS.forEach((k,i)=>{if((extraTx[k]||[]).length)last=i;});return clamp(Math.max(c,last,0),0,LAST);}
const ord=n=>n+((n%100>=11&&n%100<=13)?'th':(['th','st','nd','rd'][n%10]||'th'));
function newChart(ctx,cfg){const ex=Chart.getChart(ctx);if(ex)ex.destroy();return new Chart(ctx,cfg);}

function renderCards(actuals,budgets,startBal,startLabel){
  const inc=actuals['Income'].total,incB=budgets['Income'];
  const exp=actuals['Expenses'].total,expB=budgets['Expenses'];
  const sav=actuals['Savings'].total+actuals['Investments'].total,savB=budgets['Savings']+budgets['Investments'];
  const remaining=startBal+inc-outflow(actuals);
  const p=(a,b)=>b?Math.round(a/b*100):0;
  const pInc=p(inc,incB),pExp=p(exp,expB),pSav=p(sav,savB);
  return `<div class="sgrid">
    <div class="card sc"><div class="cicon" style="background:#ECF0F3">🏁</div><div class="clabel">Starting Balance</div><div class="cval ${startBal>=0?'pos':'neg'}">${fmtS(startBal)}</div><div class="csub">${startLabel}</div></div>
    <div class="card sc"><div class="cicon" style="background:#EEF1E8">💵</div><div class="clabel">Total Income</div><div class="cval pos">${fmt(inc)}</div><div class="csub">Budget ${fmt(incB)}&nbsp;<span class="badge ${pInc>=90?'bg':'ba'}">${pInc}%</span></div></div>
    <div class="card sc"><div class="cicon" style="background:#F5ECE1">💸</div><div class="clabel">Total Spend</div><div class="cval ${exp>expB&&expB?'neg':''}">${fmt(exp)}</div><div class="csub">Budget ${fmt(expB)}&nbsp;<span class="badge ${pExp>100?'br':pExp>80?'ba':'bg'}">${pExp}%</span></div></div>
    <div class="card sc"><div class="cicon" style="background:#F6E8EC">🏦</div><div class="clabel">Saved &amp; Invested</div><div class="cval pos">${fmt(sav)}</div><div class="csub">Budget ${fmt(savB)}&nbsp;<span class="badge bg">${pSav}%</span></div></div>
    <div class="card sc" style="border:2px solid ${remaining>=0?'var(--g3)':'var(--rd)'}"><div class="cicon" style="background:${remaining>=0?'#F6E8EC':'#F9E6E8'}">${remaining>=0?'💰':'⚠️'}</div><div class="clabel">Remaining Balance</div><div class="cval ${remaining>=0?'pos':'neg'}">${fmtS(remaining)}</div><div class="csub">${remaining>=0?'✅ Available to spend':'❌ Over budget'}</div></div>
  </div>`;
}

function renderSubcatPanels(key,actuals){
  return `<div class="spgrid">${CATS.map(cat=>renderOnePanel(key,cat,actuals,editingPanels.has(key+'|'+cat))).join('')}</div>`;
}
function panelId(key,cat){return `${key}-${cat.replace(/[^a-z0-9]/gi,'_')}`;}
function renderOnePanel(key,cat,actuals,editing){
  const cfg=CCFG[cat],subs=getSubcats(key,cat),subActs=actuals[cat].subs||{};
  const names=[...new Set([...subs.map(s=>s.n),...Object.keys(subActs)])];
  const derived=DERIVED.includes(cat);
  let totalB=0,totalA=0,rows='';
  names.forEach((name,i)=>{
    const sub=subs.find(s=>s.n===name),bVal=sub?sub.b:0,actual=subActs[name]||0;
    totalB+=bVal;totalA+=actual;
    if(editing){
      rows+=`<tr><td><input class="sc-input name-inp" id="sn-${panelId(key,cat)}-${i}" value="${esc(name)}"></td>
        <td><input class="sc-input amt-inp" id="sb-${panelId(key,cat)}-${i}" value="${bVal}" type="number" min="0" step="100"></td>
        <td class="sc-act">${actual>0?fmt(actual):'—'}</td>
        <td><button class="del-sc" onclick="delSubcatRow('${key}','${cat}',${i})">&#10005;</button></td></tr>`;
    }else{
      const p=bVal>0?Math.round(actual/bVal*100):0,over=bVal>0&&actual>bVal;
      const sIcon=bVal===0?'':over?'&#8593;':p>=90?'&#9679;':'&#8595;';
      const sColor=over?'var(--rd)':p>=90?'var(--sage)':'var(--am)';
      rows+=`<tr><td class="sc-name">${esc(name)}</td><td class="sc-bud">${bVal>0?fmt(bVal):'—'}</td>
        <td class="sc-act" style="color:${actual>0?(over?'var(--rd)':cfg.color):'var(--txl)'}">${actual>0?fmt(actual):'—'}</td>
        <td class="sc-stat">${bVal>0?`<span style="color:${sColor}">${p}% ${sIcon}</span>`:''}</td></tr>`;
    }
  });
  const btns=derived?`<button class="sp-edit-btn" onclick="setView('${cat==='Debts'?'debts':'bills'}')">Manage ›</button>`
    :editing?`<button class="sp-save-btn" onclick="saveSubcatPanel('${key}','${cat}')">&#10003; Save</button><button class="sp-cancel-btn" onclick="cancelEditPanel('${key}','${cat}')">Cancel</button>`
    :`<button class="sp-edit-btn" onclick="startEditPanel('${key}','${cat}')">&#9998; Edit</button>`;
  return `<div class="spanel"><div class="sp-hdr" style="background:${cfg.hdr}"><span class="sp-hdr-title">${cfg.icon} ${cat}</span><div>${btns}</div></div>
    <table class="sptable"><thead><tr><th>Sub Category</th><th class="ra">Budget</th><th class="ra">Actual</th><th class="ra">${editing?'':'%'}</th></tr></thead>
    <tbody id="sbody-${panelId(key,cat)}">${rows}</tbody></table>
    ${editing?`<button class="sp-add" onclick="addSubcatRow('${key}','${cat}')">&#65291; Add sub-category</button>`:''}
    <div class="sp-foot"><span>TOTALS</span><span>${fmt(totalB)} / ${fmt(totalA)}</span></div></div>`;
}
function ensureCustom(key,cat){if(!customSubcat[key])customSubcat[key]={};if(!customSubcat[key][cat])customSubcat[key][cat]=JSON.parse(JSON.stringify(getSubcats(key,cat)));}
function startEditPanel(key,cat){ensureCustom(key,cat);editingPanels.add(key+'|'+cat);render();}
function cancelEditPanel(key,cat){editingPanels.delete(key+'|'+cat);render();}
function readPanel(prefix,key,cat){
  const saved=[];let i=0;
  while(document.getElementById(`${prefix}n-${panelId(key,cat)}-${i}`)){
    const n=document.getElementById(`${prefix}n-${panelId(key,cat)}-${i}`).value.trim();
    const b=parseFloat(document.getElementById(`${prefix}b-${panelId(key,cat)}-${i}`).value)||0;
    if(n)saved.push({n,b});i++;
  }
  return saved;
}
function saveSubcatPanel(key,cat){
  ensureCustom(key,cat);customSubcat[key][cat]=readPanel('s',key,cat);
  editingPanels.delete(key+'|'+cat);saveLocal();showToast('Budget saved!');render();
  if(notionOn())notionSaveBudgetPlan(key).catch(()=>showToast('⚠️ Saved on this device — Notion sync failed'));
}
function addSubcatRow(key,cat){ensureCustom(key,cat);customSubcat[key][cat]=readPanel('s',key,cat).concat([{n:'',b:0}]);render();}
function delSubcatRow(key,cat,idx){ensureCustom(key,cat);const cur=readPanel('s',key,cat);cur.splice(idx,1);customSubcat[key][cat]=cur;render();}

function renderTx(txns,key){
  const catFiltered=txFilter==='All'?txns:txns.filter(t=>t.category===txFilter);
  const subOptions=['All',...new Set(catFiltered.map(t=>t.subcategory||'Other').sort())];
  if(!subOptions.includes(txSubFilter))txSubFilter='All';
  const q=txSearch.toLowerCase();
  const filtered=catFiltered.filter(t=>(txSubFilter==='All'||(t.subcategory||'Other')===txSubFilter)&&
    (!q||(t.desc||'').toLowerCase().includes(q)||(t.subcategory||'').toLowerCase().includes(q)||(t.account||'').toLowerCase().includes(q)));
  const total=filtered.length,pages=Math.max(1,Math.ceil(total/TX_PP));
  txPage=clamp(txPage,1,pages);
  const slice=filtered.slice((txPage-1)*TX_PP,txPage*TX_PP);
  const keyArg=key?`'${key}'`:'null';
  const rows=slice.length===0?`<tr><td colspan="6" class="nodata">No transactions yet 🌸</td></tr>`:slice.map(t=>{
    const cfg=CCFG[t.category]||CCFG.Transfer;
    const acct=t.account?(t.toAccount?`${esc(t.account)} → ${esc(t.toAccount)}`:esc(t.account)):'—';
    return `<tr><td><div class="td-desc">${esc(t.desc)}</div>${t.note?`<div class="td-note">${esc(t.note)}</div>`:''}</td>
      <td><div class="td-date">${fdate(t.date)}</div></td>
      <td><span class="cchip" style="background:${cfg.bg};color:${cfg.color}">${cfg.icon} ${esc(t.category)}</span></td>
      <td style="font-size:11px;color:var(--txm)">${esc(t.subcategory||'—')}</td>
      <td style="font-size:11px;color:var(--txm)">${acct}</td>
      <td style="text-align:right;white-space:nowrap"><span class="td-amt ${t.category==='Income'?'inc':''}">${t.category==='Income'?'+':t.category==='Transfer'?'':'&#8722;'}${fmt(t.amount)}</span><button class="delbtn" title="Delete" onclick="delTx('${t.id}')">&#10005;</button></td></tr>`;
  }).join('');
  const pnums=[...new Set([1,Math.max(1,txPage-1),txPage,Math.min(pages,txPage+1),pages])].sort((a,b)=>a-b);
  const pbtns=pnums.map((p,i,arr)=>(i>0&&p-arr[i-1]>1?'<span style="padding:0 3px;color:var(--txm)">…</span>':'')+`<button class="pbtn${p===txPage?' act':''}" onclick="txPage=${p};renderTxOnly(${keyArg})">${p}</button>`).join('');
  return `<div class="txsec"><div class="txhdr"><div class="stitle">Transactions <span class="badge bg">${total}</span></div>
    <div class="txctrls">
      <input class="sbox" placeholder="🔍 Search..." value="${esc(txSearch)}" oninput="txSearch=this.value;txPage=1;renderTxOnly(${keyArg})">
      <select class="fsel" onchange="txFilter=this.value;txSubFilter='All';txPage=1;renderTxOnly(${keyArg})">${['All',...CATS,'Transfer'].map(c=>`<option${c===txFilter?' selected':''}>${c}</option>`).join('')}</select>
      <select class="fsel" onchange="txSubFilter=this.value;txPage=1;renderTxOnly(${keyArg})">${subOptions.map(s=>`<option${s===txSubFilter?' selected':''}>${esc(s)}</option>`).join('')}</select>
      <button class="abtn" onclick="openTxModal(${keyArg})">&#65291; Add</button></div></div>
    <div style="overflow-x:auto"><table class="txt"><thead><tr><th>Description</th><th>Date</th><th>Category</th><th>Sub-category</th><th>Account</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="txpag"><span class="pinfo">Showing ${total?(txPage-1)*TX_PP+1:0}–${Math.min(txPage*TX_PP,total)} of ${total}</span>
    <div class="pbtns"><button class="pbtn" onclick="txPage=Math.max(1,txPage-1);renderTxOnly(${keyArg})" ${txPage===1?'disabled':''}>&#8592; Prev</button>${pbtns}
    <button class="pbtn" onclick="txPage=Math.min(${pages},txPage+1);renderTxOnly(${keyArg})" ${txPage===pages?'disabled':''}>Next &#8594;</button></div></div></div>`;
}
function renderTxOnly(key){
  const txns=key?getAllTx(key):allTx().sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('txWrapper').innerHTML=renderTx(txns,key);
}

      <div class="plan-sum-op">−</div>
      <div class="plan-sum-item"><div class="plan-sum-label">💸 Total Outflows</div><div class="plan-sum-val" style="color:var(--rd)">${fmt(out)}</div></div>
      <div class="plan-sum-op">=</div>
      <div class="plan-sum-item plan-sum-bal" style="background:${pos?'#EEF1E8':'#F9E6E8'};border-color:${pos?'var(--sage)':'var(--rd)'}"><div class="plan-sum-label">${pos?'✅':'⚠️'} Balance</div><div class="plan-sum-val" style="color:${pos?'var(--sage)':'var(--rd)'};font-size:20px">${fmtS(bal)}</div></div>
    </div>
    <div class="plan-save-row">
      <button class="plan-reset-btn" onclick="resetPlan('${key}')">&#8617; Reset to Default</button>
      ${idx<LAST?`<button class="plan-copy-btn" onclick="copyPlanForward('${key}')">&#128203; Copy to ${MONTHS[idx+1].name}–December</button>`:''}

}
function readPlan(key){const r={};for(const cat of CATS){if(DERIVED.includes(cat))continue;r[cat]=readPanel('p',key,cat);}return r;}
function planAddRow(key,cat){customSubcat[key]=Object.assign(customSubcat[key]||{},readPlan(key));customSubcat[key][cat].push({n:'',b:0});renderPlanner();}
function planDelRow(key,cat,i){customSubcat[key]=Object.assign(customSubcat[key]||{},readPlan(key));customSubcat[key][cat].splice(i,1);renderPlanner();}
function savePlan(key){
  customSubcat[key]=readPlan(key);saveLocal();showToast('Plan saved for '+MNAME[key]+'!');renderPlanner();
  if(notionOn())notionSaveBudgetPlan(key).catch(()=>showToast('⚠️ Saved on this device — Notion sync failed'));
}
async function copyPlanForward(key){
  customSubcat[key]=readPlan(key);
  const src=JSON.stringify(customSubcat[key]),targets=MKEYS.slice(monthIdx(key)+1);
  for(const k of targets)customSubcat[k]=JSON.parse(src);
  saveLocal();render();showToast(`Copying plan to ${targets.length} month(s)…`);
  if(notionOn()){try{for(const k of [key,...targets])await notionSaveBudgetPlan(k);showToast('Plan copied & synced ☁️');}catch(e){showToast('⚠️ Copied on this device — Notion sync failed');}}
}
function resetPlan(key){if(confirm('Reset '+MNAME[key]+' to the default plan?')){delete customSubcat[key];saveLocal();showToast('Reset to default');renderPlanner();}}

function glanceItems(){
  return [
    ...trk.bills.map(b=>({kind:'bill',id:b.id,name:b.name,cat:'Bills & Subscriptions',amount:+b.amount||0,dueDay:+b.dueDay||28,months:b.months||[],autopay:b.autopay})),
    ...trk.debts.filter(d=>(+d.pay||0)>0).map(d=>({kind:'debt',id:d.id,name:d.name,cat:'Debts',amount:+d.pay||0,dueDay:+d.dueDay||28,months:ALL12,debt:d}))
  ];
}
function dueDate(mi,day){const m=MONTHS[mi];return new Date(m.year,m.num-1,Math.min(day,new Date(m.year,m.num,0).getDate()));}
function cellStatus(it,mi){
  const paid=paidFor(it.name,it.cat,mi),due=it.months.includes(MONTHS[mi].num);
  if(it.kind==='debt'&&paid===0&&debtBalance(it.debt,mi-1)<=0&&(+it.debt.startBal||0)>0)return {cls:'na',paid};
  if(!due&&paid<=0)return {cls:'na',paid};
  if(paid>0)return {cls:paid>=it.amount*0.98?'paid':'partial',paid};
  const days=(dueDate(mi,it.dueDay)-today0())/86400000;
  return {cls:days<0?'over':days<=7?'soon':'up',paid,days};
}
const ICON={paid:'✅',partial:'🟡',over:'⚠️',soon:'⏰',up:'⏳',na:'—'};
const k1=n=>n>=1000?(n/1000).toFixed(n%1000?1:0)+'K':Math.round(n);

function payItem(kind,id,mi){

function netWorthAt(mi){
  const cash=trk.accounts.reduce((s,a)=>s+accountBalance(a,mi),0);
  const other=trk.assets.filter(x=>x.type==='Asset').reduce((s,x)=>s+(+x.value||0),0);
  const debt=trk.debts.reduce((s,d)=>s+debtBalance(d,mi),0);
  const liab=trk.assets.filter(x=>x.type==='Liability').reduce((s,x)=>s+(+x.value||0),0);
  return {cash,other,debt,liab,assets:cash+other,liabilities:debt+liab,net:cash+other-debt-liab};
}

    if(fld.type==='months')return `<div class="chkgrid">${MSHORT.map((m,i)=>`<label><input type="checkbox" class="ff-mo" value="${i+1}" ${(v||[]).includes(i+1)?'checked':''}> ${m}</label>`).join('')}</div>

    return `<input id="ff-${fld.k}" type="${fld.type||'text'}" value="${esc(v)}" ${fld.type==='number'?'step="any"':''} placeholder="${esc(fld.ph||'')}">`;};
  document.getElementById('genBody').innerHTML=`<h3>${title}</h3>${note?`<p class="plan-hint" style="margin-top:-8px">${note}</p>`:''}
    ${fields.map(fld=>`<div class="fg"><label>${esc(fld.label)}</label>${f(fld)}${fld.hint?`<div class="hint">${fld.hint}</div>`:''}</div>`).join('')}
    <div class="mbtns">${onDelete?'<button class="danger" onclick="formDel()">Delete</button>':''}<button class="bcnl" onclick="closeGen()">Cancel</button><button class="bsav" onclick="formOk()">Save</button></div>`;
  document.getElementById('genBody').dataset.fields=JSON.stringify(fields.map(x=>({k:x.k,type:x.type})));
  document.getElementById('genModal').classList.add('open');

function formOk(){
  const fields=JSON.parse(document.getElementById('genBody').dataset.fields),v={};
  for(const fl of fields){
    if(fl.type==='months')v[fl.k]=[...document.querySelectorAll('.ff-mo:checked')].map(c=>+c.value);
    else if(fl.type==='checkbox')v[fl.k]=document.getElementById('ff-'+fl.k).checked;
    else v[fl.k]=document.getElementById('ff-'+fl.k).value;
  }
  if(formSave&&formSave(v)===false)return; closeGen();
}
function formDel(){if(formDelete&&confirm('Delete this item?')){formDelete();closeGen();}}
function closeGen(){document.getElementById('genModal').classList.remove('open');}

function renameLinked(oldName,newName,cat,field){
  if(!oldName||oldName===newName)return;
  for(const k of MKEYS)for(const t of extraTx[k]||[]){
    if(field==='sub'&&t.category===cat&&t.subcategory===oldName)t.subcategory=newName;
    if(field==='acct'){if(t.account===oldName)t.account=newName;if(t.toAccount===oldName)t.toAccount=newName;}
  }
}

function openSettings(){

    <div class="mbtns"><button class="bcnl" onclick="closeGen()">Close</button></div>`;
  document.getElementById('genModal').classList.add('open');

function exportBackup(){
  const blob=new Blob([JSON.stringify({version:1,year:YEAR,extraTx,customSubcat,trk},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`budget-${YEAR}-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Replace the data on this device with this backup?'))return;
    extraTx=d.extraTx||{};customSubcat=d.customSubcat||{};trk=Object.assign(JSON.parse(JSON.stringify(DEFAULT_TRK)),d.trk||{});
    saveLocal();saveTrackers();closeGen();showToast('Backup restored');render();}catch(e){alert('That file is not a valid backup.');}};
  r.readAsText(f);input.value='';
}

  const key=modalKey||activeKey,cat=document.getElementById('f-cat').value,sel=document.getElementById('f-sub');

  else if(cat==='Debts')names=trk.debts.map(d=>d.name);
  else names=getSubcats(key,cat).map(s=>s.n);
  names=[...new Set(names.filter(Boolean))];
  if(keep&&!names.includes(keep))names.unshift(keep);
  sel.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('')+(cat==='Transfer'?'':'<option>Other</option>');
  if(keep)sel.value=keep;
  const showTo=cat==='Transfer'||cat==='Savings';
  document.getElementById('f-to-wrap').style.visibility=showTo?'visible':'hidden';
  document.getElementById('f-acct-lbl').textContent=cat==='Income'?'Received in':cat==='Transfer'?'Moved from':'Paid from';
}
function acctOptions(sel,blank){return (blank?'<option value="">— none —</option>':'')+trk.accounts.map(a=>`<option value="${esc(a.name)}"${a.name===sel?' selected':''}>${esc(acctLabel(a))}</option>`).join('');}
function openTxModal(key,pre={}){
  modalKey=key||(pre.date&&keyForDate(pre.date))||activeKey;
  const m=MONTHS[monthIdx(modalKey)],d=new Date();
  const inMonth=d.getFullYear()===m.year&&d.getMonth()+1===m.num;
  document.getElementById('f-date').value=pre.date||`${m.year}-${pad(m.num)}-${inMonth?pad(d.getDate()):'01'}`;
  document.getElementById('f-amt').value=pre.amount??'';
  document.getElementById('f-desc').value=pre.desc||'';
  document.getElementById('f-note').value='';
  document.getElementById('f-cat').value=pre.cat||'Expenses';
  document.getElementById('f-cat').onchange=()=>{updateSubcatDropdown();autoTo();};
  updateSubcatDropdown(pre.sub);
  const def=pre.account||lastAccount||(trk.accounts[0]&&trk.accounts[0].name)||'';
  document.getElementById('f-acct').innerHTML=acctOptions(def,false);
  document.getElementById('f-to').innerHTML=acctOptions('',true);
  document.getElementById('f-sub').onchange=autoTo;autoTo();
  document.getElementById('txModal').classList.add('open');
  setTimeout(()=>document.getElementById(pre.amount?'f-desc':'f-amt').focus(),50);
}
function guessTo(sub){const words=String(sub||'').toLowerCase().split(/\s+/).filter(w=>w.length>3);
  return (trk.accounts.find(a=>words.some(w=>(a.purpose+' '+a.name).toLowerCase().includes(w)))||{}).name||'';}
function autoTo(){if(document.getElementById('f-cat').value!=='Savings')return;const g=guessTo(document.getElementById('f-sub').value);if(g)document.getElementById('f-to').value=g;}
function closeTxModal(){document.getElementById('txModal').classList.remove('open');}
async function saveTx(){
  const date=document.getElementById('f-date').value,amount=parseFloat(document.getElementById('f-amt').value);
  const desc=document.getElementById('f-desc').value.trim()||document.getElementById('f-sub').value;
  const category=document.getElementById('f-cat').value,subcategory=document.getElementById('f-sub').value;
  const account=document.getElementById('f-acct').value;
  const toAccount=(category==='Transfer'||category==='Savings')?document.getElementById('f-to').value:'';
  const note=document.getElementById('f-note').value.trim();
  if(!date||!amount){alert('Please enter a date and amount.');return;}
  if(category==='Transfer'&&(!toAccount||toAccount===account)){alert('Pick the account the money moved to.');return;}
  const key=keyForDate(date)||modalKey||activeKey;
  const tx={id:uid(),date,desc,amount,category,subcategory,account,toAccount,note};
  (extraTx[key]=extraTx[key]||[]).push(tx);
  lastAccount=account;saveLocal();closeTxModal();render();
  if(!notionOn()){showToast('Saved on this device');return;}
  try{tx._nid=await notionCreate(tx,key);tx.id=tx._nid;saveLocal();render();showToast('Transaction saved & synced ☁️');}
  catch(e){showToast('⚠️ Saved on this device — Notion sync failed');setSyncStatus('error');}
}
async function delTx(id){
  for(const k of MKEYS){const arr=extraTx[k]||[],i=arr.findIndex(t=>t.id===id);
    if(i>=0){if(!confirm('Delete this transaction?'))return;const [tx]=arr.splice(i,1);saveLocal();render();
      if(tx._nid){try{await notionArchive(tx._nid);}catch(e){showToast('⚠️ Deleted here — Notion sync failed');}}return;}}
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
function render(){
  renderTabs();destroyCharts();
  ({monthly:renderMonthly,ytd:renderYTD,planner:renderPlanner,bills:renderBills,debts:renderDebts,accounts:renderAccounts,networth:renderNetWorth}[view]||renderMonthly)();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeTxModal();closeGen();}});
document.addEventListener('DOMContentLoaded',()=>{
  loadLocal();render();
  if(notionOn())loadFromNotion();else setSyncStatus('error');
});

</script>
